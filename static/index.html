<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget-Buudy.V2</title>
    <meta name="description" content="Professional AI-powered expense analysis tool.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-logo-container">
                <div class="logo-icon-small">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <span class="header-project-name">Budget Buddy V2</span>
            </div>
            <div class="mode-toggle">
                <button id="mode-wallet" class="mode-btn active">Wallet</button>
                <button id="mode-analyst" class="mode-btn">Market Analyst</button>
            </div>
            <div class="header-actions-container">
                <button id="new-chat-btn" class="new-chat-btn">New Chat</button>
            </div>
        </header>
        <!-- Chat History Area -->
        <main class="chat-container" id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="logo-icon-large" id="welcome-logo">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 id="welcome-title">Budget Buddy V2</h1>
                <p id="welcome-desc">Your intelligent financial advisor. Upload expense data, ask about the stock market, or get currency rates.</p>
            </div>
            <!-- Chat bubbles will be injected here -->
        </main>

        <!-- Fixed Bottom Input Area -->
        <footer class="chatbox-container">
            <div class="chatbox-bar">
                <input type="file" id="file-input" accept=".csv,.txt,.pdf,image/png,image/jpeg,image/jpg" hidden>
                <button id="attach-btn" class="icon-btn" title="Attach File">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                </button>
                
                <div class="input-wrapper">
                    <div id="file-badge" class="file-badge hidden">
                        <span id="file-name">file.csv</span>
                        <button id="remove-file-btn">&times;</button>
                    </div>
                    <textarea id="user-prompt" placeholder="Ask a financial question, track a stock, or upload data..." rows="1"></textarea>
                </div>

                <button id="import-btn" class="send-btn" title="Send">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
            <p class="footer-note">Budget-Buudy.V2 can make mistakes. Consider verifying important financial information.</p>
        </footer>
    </div>

    <!-- Include marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
